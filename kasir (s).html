<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3e4b59">
<title>Kasir — Studio C3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script>
// ============================ TEMA WARNA ============================
// Ganti kata di bawah dengan salah satu: capybara, kuning, biru, pink, mint, ungu
// (index.html dan kasir.html sebaiknya memakai kata yang sama)
var TEMA = "capybara";

// Setiap tema = 5 warna dasar: latar, kartu, aksen, aksen gelap, teks.
// "vars" (opsional) = pengaturan warna lanjutan. Untuk tema baru cukup salin salah satu baris sederhana (mis. biru).
var THEMES = {
  capybara: {
    yellow: "#7a4b2e",   // latar utama: cokelat
    cream: "#f7e3b5",    // kartu
    gold: "#3e4b59",     // aksen: abu-abu slate (tombol, garis, judul kecil)
    goldDeep: "#2b3541", // abu-abu gelap
    ink: "#2e1b0c",      // teks di kartu: cokelat sangat gelap
    capy: true,          // tampilkan gambar capybara
    vars: {
      "on-bg": "#f7e3b5",                                                // teks di atas latar cokelat
      "head-bg": "#3e4b59", "head-fg": "#f7e3b5", "brand-accent": "#f2b880",
      "head-btn-bg": "#f2b880", "head-btn-fg": "#2e1b0c",
      "band": "#3e4b59", "on-band": "#f7e3b5",                           // bagian "Dari pilih paket..."
      "btn2-bg": "#f2b880", "btn2-fg": "#2e1b0c", "btn2-hover": "#f7cfa6", // tombol di atas latar cokelat
      "ghost-fg": "#f7e3b5", "ghost-line": "#f7e3b5",
      "deal-bg": "#7fa5a3", "deal-fg": "#2e1b0c",                        // hijau toska
      "step-bg": "#7fa5a3", "step-fg": "#2e1b0c",
      "notice-bg": "#d98c75", "notice-fg": "#2e1b0c",
      "ring": "#7fa5a3", "ring2": "#f2b880", "badge-bg": "#7fa5a3", "focus": "#f2b880",
      "strip-label": "#f2b880",
      "f1": "#f2b880", "f2": "#f7e3b5", "f3": "#7fa5a3", "f4": "#d98c75"
    }
  },
  kuning: { yellow: "#ffd21f", cream: "#fff8d6", gold: "#7a5900", goldDeep: "#4f3a00", ink: "#2b2000" },
  biru:   { yellow: "#8ecbff", cream: "#eef7ff", gold: "#0b4f8a", goldDeep: "#08345c", ink: "#04182b" },
  pink:   { yellow: "#ffb6d1", cream: "#fff0f6", gold: "#8a1c4f", goldDeep: "#5c0f35", ink: "#2a0a18" },
  mint:   { yellow: "#8fe3c0", cream: "#effcf6", gold: "#0f5c3f", goldDeep: "#083d29", ink: "#04251a" },
  ungu:   { yellow: "#cdb8ff", cream: "#f5f0ff", gold: "#4b2a8f", goldDeep: "#2f1a5e", ink: "#170c33" }
};
// ====================================================================

// Bagian di bawah ini tidak perlu diubah.
(function () {
  var t = THEMES[TEMA] || THEMES.kuning;
  function rgb(h) { h = h.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
  function mix(a, b, w) {
    var x = rgb(a), y = rgb(b), o = "#";
    for (var i = 0; i < 3; i++) o += ("0" + Math.round(x[i] * (1 - w) + y[i] * w).toString(16)).slice(-2);
    return o;
  }
  function rgba(h, a) { return "rgba(" + rgb(h).join(", ") + ", " + a + ")"; }
  var v = {
    "yellow": t.yellow, "cream": t.cream, "gold": t.gold, "gold-deep": t.goldDeep, "ink": t.ink,
    "line": rgba(t.gold, .45), "soft": rgba(t.gold, .1), "shadow": rgba(t.goldDeep, .25), "hover": rgba(t.yellow, .35),
    "hi": mix(t.cream, "#ffffff", .6),
    "f1": mix(t.yellow, "#ffffff", .45), "f2": t.cream, "f3": mix(t.yellow, t.gold, .12), "f4": mix(t.yellow, "#ffffff", .2),
    "done": mix(t.cream, t.gold, .22), "done-line": mix(t.cream, t.gold, .5),
    // pengaturan lanjutan (nilai awal = perilaku tema biasa)
    "bg": t.yellow, "on-bg": t.ink, "head-bg": "transparent", "head-fg": t.ink, "brand-accent": t.gold,
    "head-btn-bg": t.gold, "head-btn-fg": t.cream, "band": t.goldDeep, "on-band": t.cream,
    "btn2-bg": t.gold, "btn2-fg": t.cream, "btn2-hover": t.goldDeep, "ghost-fg": t.goldDeep, "ghost-line": t.gold,
    "deal-bg": t.gold, "deal-fg": t.cream, "step-bg": t.yellow, "step-fg": t.ink,
    "notice-bg": t.gold, "notice-fg": t.cream, "ring": t.gold, "ring2": t.gold, "badge-bg": t.yellow,
    "focus": t.ink, "strip-label": t.yellow
  };
  if (t.vars) for (var kk in t.vars) v[kk] = t.vars[kk];
  for (var k in v) document.documentElement.style.setProperty("--" + k, v[k]);

  // Gambar capybara (hanya tema capybara)
  if (t.capy) {
    var line = "#5c3317", body = "#d2914f", part = "#a0643a";
    var capy = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150"><g stroke="' + line + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">' +
      '<circle cx="50" cy="34" r="14" fill="' + part + '"/><circle cx="150" cy="34" r="14" fill="' + part + '"/>' +
      '<path d="M40 142C34 122 38 108 30 92C20 70 28 42 55 30C76 20 124 20 145 30C172 42 180 70 170 92C162 108 166 122 160 142Z" fill="' + body + '"/>' +
      '<path d="M44 110Q52 114 60 116M156 110Q148 114 140 116" fill="none"/>' +
      '<ellipse cx="72" cy="64" rx="4" ry="6" fill="' + line + '" stroke="none"/><ellipse cx="128" cy="64" rx="4" ry="6" fill="' + line + '" stroke="none"/>' +
      '<ellipse cx="100" cy="80" rx="20" ry="15" fill="' + line + '" stroke="none"/>' +
      '<ellipse cx="93" cy="82" rx="3" ry="2.2" fill="#7a4a28" stroke="none"/><ellipse cx="107" cy="82" rx="3" ry="2.2" fill="#7a4a28" stroke="none"/>' +
      '<path d="M100 95V101M80 98Q90 110 100 101Q110 110 120 98" fill="none" stroke-width="3.5"/>' +
      '<ellipse cx="64" cy="138" rx="17" ry="11" fill="' + part + '"/><ellipse cx="136" cy="138" rx="17" ry="11" fill="' + part + '"/>' +
      '<path d="M58 134V143M64 132V144M70 134V143M130 134V143M136 132V144M142 134V143" fill="none" stroke-width="2.5"/></g></svg>';
    // Pola samar di latar: dua kepala capybara kecil
    function mini(x, y) {
      return '<g transform="translate(' + x + ' ' + y + ') scale(.34)"><g fill="' + t.cream + '" fill-opacity=".08">' +
        '<circle cx="50" cy="34" r="16"/><circle cx="150" cy="34" r="16"/>' +
        '<path d="M40 142C34 122 38 108 30 92C20 70 28 42 55 30C76 20 124 20 145 30C172 42 180 70 170 92C162 108 166 122 160 142Z"/></g>' +
        '<g fill="' + t.ink + '" fill-opacity=".14"><ellipse cx="72" cy="64" rx="5" ry="7"/><ellipse cx="128" cy="64" rx="5" ry="7"/><ellipse cx="100" cy="80" rx="20" ry="15"/></g></g>';
    }
    var tile = '<svg xmlns="http://www.w3.org/2000/svg" width="170" height="170" viewBox="0 0 170 170">' + mini(14, 18) + mini(96, 100) + '</svg>';
    var root = document.documentElement.style;
    root.setProperty("--capy", 'url("data:image/svg+xml;utf8,' + encodeURIComponent(capy) + '")');
    root.setProperty("--capy-tile", 'url("data:image/svg+xml;utf8,' + encodeURIComponent(tile) + '")');
    root.setProperty("--peek-space", "90px");
  }

  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", (t.vars && t.vars["head-bg"]) || t.yellow);
})();
</script>
<style>
  :root {
    --yellow: #ffd21f; --cream: #fff8d6; --gold: #7a5900; --gold-deep: #4f3a00; --ink: #2b2000;
    --line: rgba(122, 89, 0, .45); --good: #17692c; --bad: #9b1c1c;
    --hi: #fffdf0; --soft: rgba(122, 89, 0, .1); --shadow: rgba(79, 58, 0, .25); --hover: rgba(255, 210, 31, .35);
    --f1: #ffe978; --f2: #fff8d6; --f3: #f5c400; --f4: #ffe24a; --done: #d9cfa3; --done-line: #a99a5a;
    --bg: #ffd21f; --on-bg: #2b2000; --head-bg: transparent; --head-fg: #2b2000; --brand-accent: #7a5900;
    --head-btn-bg: #7a5900; --head-btn-fg: #fff8d6; --band: #4f3a00; --on-band: #fff8d6;
    --btn2-bg: #7a5900; --btn2-fg: #fff8d6; --btn2-hover: #4f3a00; --ghost-fg: #4f3a00; --ghost-line: #7a5900;
    --deal-bg: #7a5900; --deal-fg: #fff8d6; --step-bg: #ffd21f; --step-fg: #2b2000; --notice-bg: #7a5900; --notice-fg: #fff8d6;
    --ring: #7a5900; --ring2: #7a5900; --badge-bg: #ffd21f; --focus: #2b2000; --strip-label: #ffd21f;
    --font-head: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background-color: var(--bg); background-image: var(--capy-tile, none); background-size: 170px; color: var(--on-bg); font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.5; }
  h1, h2 { font-family: var(--font-head); margin: 0; line-height: 1.15; letter-spacing: -0.02em; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .wrap { width: min(920px, 100% - 2rem); margin-inline: auto; padding: 1.2rem 0 3rem; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: calc(1.5rem + var(--peek-space, 0px)); }
  header h1 { font-size: 1.3rem; font-weight: 800; }
  .btn { border: 0; cursor: pointer; background: var(--gold); color: var(--cream); font: inherit; font-weight: 700; padding: .8rem 1.3rem; border-radius: 999px; }
  .btn:hover { background: var(--gold-deep); }
  .btn.ghost { background: transparent; color: var(--gold-deep); border: 2px solid var(--gold); }
  header .btn.ghost { color: var(--ghost-fg); border-color: var(--ghost-line); }
  .btn.small { padding: .45rem .9rem; font-size: .92rem; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .card { position: relative; color: var(--ink); background: var(--cream); border: 2px solid var(--gold); border-radius: 20px; padding: 1.3rem; margin-bottom: 1.4rem; }
  .card h2 { font-size: 1.05rem; margin-bottom: .9rem; }
  input[type=text], input[type=password] {
    width: 100%; font: inherit; padding: .85rem 1rem; border-radius: 12px; border: 2px solid var(--line); background: var(--hi); color: var(--ink);
  }
  input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px var(--gold); }
  .row { display: flex; gap: .7rem; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 12rem; }
  .code-input { font-family: var(--font-head); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .msg { margin-top: .8rem; font-weight: 500; }
  .msg.err { color: var(--bad); }
  .hidden { display: none !important; }

  .result { margin-top: 1.1rem; border-radius: 16px; overflow: hidden; border: 3px solid var(--ink); background: var(--hi); }
  .result .verdict { padding: 1rem 1.2rem; color: #fff; display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
  .result .verdict.ok { background: var(--good); }
  .result .verdict.no { background: var(--bad); }
  .result .verdict b { font-family: var(--font-head); font-size: 1.5rem; }
  .result .info { padding: 1.1rem 1.2rem; }
  .result dl { margin: 0 0 1rem; display: grid; gap: .45rem; }
  .result dl div { display: flex; justify-content: space-between; gap: 1rem; }
  .result dt { color: var(--gold); }
  .result dd { margin: 0; font-weight: 700; text-align: right; }
  .actions { display: flex; gap: .6rem; flex-wrap: wrap; }

  .tabs { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .tabs .count { margin-left: auto; font-weight: 700; }
  .tab[aria-pressed=true] { background: var(--gold); color: var(--cream); }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid var(--line); }
  th { color: var(--gold); font-weight: 500; font-size: .92rem; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  td.code { font-family: var(--font-head); font-weight: 700; font-size: .92rem; }
  .pill { display: inline-block; padding: .05rem .6rem; border-radius: 999px; font-size: .85rem; font-weight: 700; border: 2px solid var(--gold); background: var(--badge-bg); }
  .pill.paid { background: var(--gold); color: var(--cream); }
  .pill.done { background: var(--done); border-color: var(--done-line); }

  /* Capybara mengintip dari tepi atas kartu (hanya tema capybara) */
  .card.peek::before {
    content: ""; position: absolute; right: 7%; bottom: calc(100% - 6px); width: 130px; height: 97px;
    background: var(--capy, none) center bottom / contain no-repeat; pointer-events: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kasir Studio C3</h1>
    <button class="btn ghost small hidden" id="logout" type="button">Keluar</button>
  </header>

  <!-- Masuk dengan PIN -->
  <section class="card peek" id="login">
    <h2>Masuk</h2>
    <form id="loginForm" class="row">
      <input type="password" id="pin" placeholder="PIN kasir" autocomplete="current-password" aria-label="PIN kasir">
      <button class="btn" type="submit">Masuk</button>
    </form>
    <p class="msg err hidden" id="loginErr"></p>
  </section>

  <div id="panel" class="hidden">
    <!-- Cek kode -->
    <section class="card peek">
      <h2>Cek kode tiket</h2>
      <form id="checkForm" class="row">
        <input type="text" id="code" class="code-input" placeholder="C3-XXXXXX" autocomplete="off" autocapitalize="characters" aria-label="Kode tiket">
        <button class="btn" type="submit">Cek kode</button>
      </form>
      <p class="msg err hidden" id="checkErr"></p>
      <div class="result hidden" id="result"></div>
    </section>

    <!-- Daftar antrean -->
    <section class="card">
      <h2>Daftar tiket</h2>
      <div class="tabs">
        <button class="btn ghost small tab" id="tabToday" type="button" aria-pressed="true">Hari ini</button>
        <button class="btn ghost small tab" id="tabTomorrow" type="button" aria-pressed="false">Besok</button>
        <span class="count" id="count"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>No</th><th>Kode</th><th>Nama</th><th>Paket</th><th>Total</th><th>Status</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="msg" id="listMsg"></p>
    </section>
  </div>
</div>

<script>
(function () {
  // ===== PENGATURAN =====
  var SUPABASE_URL = "https://qswzamffenpwslpzvypa.supabase.co";   // sama dengan di index.html, contoh: https://abcdefghij.supabase.co
  var SUPABASE_KEY = "sb_publishable_QX3ZNgzic5gASzHK2KYk4g_X320_k8n";   // sama dengan di index.html (anon public / publishable key)
  // ======================

  var $ = function (id) { return document.getElementById(id); };
  var pin = "", listDate = null, todayKey = null, tomorrowKey = null, currentCode = "", timer = null;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function rp(n) { return "Rp" + Number(n).toLocaleString("id-ID"); }
  function dateLabel(key) {
    var p = key.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long" });
  }
  function pillClass(st) { return st === "Lunas" ? "pill paid" : (st === "Sudah dipakai" || st === "Batal") ? "pill done" : "pill"; }

  // Ambil hanya alamat dasarnya (https://xxxx.supabase.co), tambahan seperti /rest/v1/ dibuang otomatis
  function baseUrl() {
    var m = String(SUPABASE_URL || "").trim().match(/^https?:\/\/[^\/\s]+/i);
    return m ? m[0] : "";
  }
  function rpc(fn, args) {
    if (!baseUrl() || !SUPABASE_KEY) return Promise.reject(new Error("SUPABASE_URL dan SUPABASE_KEY belum diisi di kasir.html"));
    return fetch(baseUrl() + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
      body: JSON.stringify(args || {})
    }).then(function (r) { return r.json(); });
  }
  function netError(err) {
    return err && err.message && err.message.indexOf("SUPABASE_") === 0 ? err.message : "Tidak bisa terhubung ke sistem. Coba lagi.";
  }
  // Pesan dari server (PIN salah, kode tidak ditemukan, dll.). Respons tanpa "ok" berarti kesalahan teknis.
  function serverMsg(res) {
    if (res && res.error) return res.error;
    var d = res ? [res.code, res.message, res.hint].filter(Boolean).join(" | ") : "";
    return "Sistem belum siap." + (d ? " Detail: " + d : "");
  }

  // ----- Login -----
  function showPanel(on) {
    $("login").classList.toggle("hidden", on);
    $("panel").classList.toggle("hidden", !on);
    $("logout").classList.toggle("hidden", !on);
  }
  function tryLogin(p, silent) {
    pin = p;
    return rpc("kasir_list", { p_pin: p, p_date: "" }).then(function (res) {
      if (!res.ok) throw new Error(serverMsg(res));
      try { sessionStorage.setItem("c3_pin", p); } catch (e) {}
      showPanel(true);
      applyList(res);
      clearInterval(timer);
      timer = setInterval(function () { loadList(listDate, true); }, 20000);
    }).catch(function (err) {
      pin = "";
      try { sessionStorage.removeItem("c3_pin"); } catch (e) {}
      showPanel(false);
      if (!silent) {
        var el = $("loginErr");
        el.textContent = err.message && err.message.indexOf("Failed") === -1 && err.message.indexOf("NetworkError") === -1 ? err.message : netError(err);
        el.classList.remove("hidden");
      }
    });
  }
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    $("loginErr").classList.add("hidden");
    if (!$("pin").value) return;
    tryLogin($("pin").value, false);
  });
  $("logout").addEventListener("click", function () {
    pin = ""; clearInterval(timer);
    try { sessionStorage.removeItem("c3_pin"); } catch (e) {}
    $("pin").value = "";
    $("result").classList.add("hidden");
    showPanel(false);
  });

  // ----- Daftar -----
  function applyList(res) {
    todayKey = res.today; tomorrowKey = res.tomorrow; listDate = res.date;
    $("tabToday").setAttribute("aria-pressed", String(res.date === res.today));
    $("tabTomorrow").setAttribute("aria-pressed", String(res.date === res.tomorrow));
    $("count").textContent = res.used + " dari " + res.max + " tiket";
    var body = $("rows");
    if (!res.tickets.length) {
      body.innerHTML = "";
      $("listMsg").textContent = "Belum ada tiket untuk " + dateLabel(res.date) + ".";
      return;
    }
    $("listMsg").textContent = dateLabel(res.date) + ". Ketuk baris untuk membuka tiket.";
    body.innerHTML = res.tickets.map(function (t) {
      return '<tr data-code="' + esc(t.code) + '"><td>' + ("0" + t.queue).slice(-2) + '</td><td class="code">' + esc(t.code) +
        "</td><td>" + esc(t.name) + "</td><td>" + esc(t.pkgName) + " (" + t.strips + ")</td><td>" + rp(t.price) +
        '</td><td><span class="' + pillClass(t.status) + '">' + esc(t.status) + "</span></td></tr>";
    }).join("");
  }
  function loadList(date, quiet) {
    rpc("kasir_list", { p_pin: pin, p_date: date || "" }).then(function (res) {
      if (res.ok) applyList(res);
      else if (res.error === "PIN salah.") $("logout").click();
    }).catch(function () { if (!quiet) $("listMsg").textContent = "Tidak bisa memuat daftar."; });
  }
  $("tabToday").addEventListener("click", function () { loadList(todayKey); });
  $("tabTomorrow").addEventListener("click", function () { loadList(tomorrowKey); });
  $("rows").addEventListener("click", function (e) {
    var tr = e.target.closest("tr[data-code]");
    if (!tr) return;
    $("code").value = tr.getAttribute("data-code");
    check(tr.getAttribute("data-code"));
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ----- Cek kode -----
  function showResult(res) {
    var t = res.ticket, v = res.validity;
    currentCode = t.code;
    var canPay = v.valid && t.status === "Menunggu bayar";
    var canUse = v.valid;
    var box = $("result");
    box.innerHTML =
      '<div class="verdict ' + (v.valid ? "ok" : "no") + '"><b>' + esc(v.label) + "</b><span>" + esc(v.detail) + "</span></div>" +
      '<div class="info"><dl>' +
        "<div><dt>Kode</dt><dd>" + esc(t.code) + "</dd></div>" +
        "<div><dt>Nama</dt><dd>" + esc(t.name) + "</dd></div>" +
        "<div><dt>Tanggal</dt><dd>" + esc(dateLabel(t.date)) + "</dd></div>" +
        "<div><dt>Antrean</dt><dd>" + ("0" + t.queue).slice(-2) + "</dd></div>" +
        "<div><dt>Paket</dt><dd>" + esc(t.pkgName) + " (" + t.strips + " strip)</dd></div>" +
        (t.people ? "<div><dt>Jumlah orang</dt><dd>" + t.people + " orang</dd></div>" : "") +
        "<div><dt>Total</dt><dd>" + rp(t.price) + "</dd></div>" +
        "<div><dt>Cara bayar</dt><dd>" + (t.pay === "qris" ? "QRIS" : "Tunai") + "</dd></div>" +
        '<div><dt>Status</dt><dd><span class="' + pillClass(t.status) + '">' + esc(t.status) + "</span></dd></div>" +
      "</dl>" +
      '<div class="actions">' +
        (canPay ? '<button class="btn" data-set="Lunas" type="button">Tandai lunas</button>' : "") +
        (canUse ? '<button class="btn" data-set="Sudah dipakai" type="button">Tandai sudah dipakai</button>' : "") +
        (t.status !== "Batal" && t.status !== "Sudah dipakai" ? '<button class="btn ghost" data-set="Batal" type="button">Batalkan tiket</button>' : "") +
      "</div></div>";
    box.classList.remove("hidden");
  }
  function check(code) {
    $("checkErr").classList.add("hidden");
    $("result").classList.add("hidden");
    rpc("kasir_check", { p_pin: pin, p_code: code }).then(function (res) {
      if (!res.ok) {
        $("checkErr").textContent = res.error === "Kode tidak ditemukan." ? "Kode tidak ditemukan. Tiket TIDAK valid." : serverMsg(res);
        $("checkErr").classList.remove("hidden");
        return;
      }
      showResult(res);
    }).catch(function (err) {
      $("checkErr").textContent = netError(err);
      $("checkErr").classList.remove("hidden");
    });
  }
  $("checkForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var c = $("code").value.trim();
    if (c) check(c);
  });
  $("result").addEventListener("click", function (e) {
    var b = e.target.closest("[data-set]");
    if (!b) return;
    var status = b.getAttribute("data-set");
    if (status === "Batal" && !confirm("Batalkan tiket " + currentCode + "? Kuota hari itu akan kembali.")) return;
    b.disabled = true;
    rpc("kasir_set_status", { p_pin: pin, p_code: currentCode, p_status: status }).then(function (res) {
      if (!res.ok) throw new Error(serverMsg(res));
      showResult(res);
      loadList(listDate, true);
    }).catch(function (err) {
      b.disabled = false;
      $("checkErr").textContent = err.message && err.message.indexOf("Failed") === -1 ? err.message : netError(err);
      $("checkErr").classList.remove("hidden");
    });
  });

  // Masuk otomatis jika PIN masih tersimpan di sesi ini
  try {
    var saved = sessionStorage.getItem("c3_pin");
    if (saved) tryLogin(saved, true);
  } catch (e) {}
})();
</script>
</body>
</html>
